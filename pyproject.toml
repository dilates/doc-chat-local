[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-chat-local"
version = "1.0.0"
description = "Chat with your documents using local AI — no cloud required"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
    "pypdf>=4.0.0",
    "watchdog>=4.0.0",
    "textual>=0.80.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "pathspec>=0.12.0",
]

[project.scripts]
doc-chat = "doc_chat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["doc_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
